<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIKHO</title>
  <meta name="description" content="VIKHO — Hardtech / Industrial / Rave" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --noir: #0A0A0A;
      --rouge: #E10600;
      --blanc: #F2F2F2;
      --metal: #1a1d1f;
      --metal-light: #222629;
    }
    html, body {
      min-height: 100%;
      background-color: var(--noir);
      color: var(--blanc);
      font-family: 'IBM Plex Mono', monospace;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 0 0 48px;
    }
    .hero {
      width: 100%;
      height: 300px;
      position: relative;
      overflow: hidden;
    }
    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
      display: block;
    }
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(10,10,10,0) 30%, rgba(10,10,10,1) 100%);
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 24px;
      margin-top: -20px;
      position: relative;
      z-index: 1;
    }
    .name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(80px, 22vw, 108px);
      line-height: 0.85;
      letter-spacing: 8px;
      color: var(--blanc);
      text-align: center;
    }
    .tagline {
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #555;
      margin-top: 12px;
      margin-bottom: 36px;
      text-align: center;
    }
    .divider {
      width: 100%;
      height: 1px;
      background: var(--rouge);
      opacity: 0.25;
      margin-bottom: 32px;
    }
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .link-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 15px 18px;
      background: var(--metal);
      border-left: 3px solid var(--rouge);
      text-decoration: none;
      color: var(--blanc);
      transition: background 0.12s ease;
    }
    .link-item:hover { background: var(--metal-light); }
    .link-icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; color: var(--rouge); }
    .link-text { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .link-label { font-size: 12px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--blanc); }
    .link-sub { font-size: 10px; letter-spacing: 0.5px; color: #555; }
    .link-arrow { color: var(--rouge); font-size: 14px; flex-shrink: 0; }
    .footer { margin-top: 40px; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #2a2a2a; text-align: center; }
  </style>
</head>
